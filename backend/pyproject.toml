[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-backend"
version = "0.1.0"
description = "Backend for a multimodal RAG system with evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi[all]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "structlog>=24.0.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "httpx>=0.27.0",
  "PyMuPDF>=1.24.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

