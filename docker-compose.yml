version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_CHROMA_PERSIST_DIR=/data/chroma
      - RAG_UPLOAD_DIR=/data/uploads
      - RAG_CORS_ORIGINS=["http://localhost:5173","http://localhost:80","http://frontend:80"]
    volumes:
      - chroma_data:/data/chroma
      - upload_data:/data/uploads
      - eval_reports:/app/eval_reports
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
  upload_data:
  eval_reports:
  ollama_models:

